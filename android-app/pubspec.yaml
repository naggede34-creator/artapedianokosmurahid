name: artapedia_app
description: Aplikasi Android ARTA PEDIA (WebView) dengan layar pembuka animasi.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  url_launcher: ^6.3.0
  permission_handler: ">=11.3.1 <13.0.0"
  file_picker: ">=8.1.0 <11.0.0"
  share_plus: ^10.1.4
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/maskot.webp

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ikon.png"
  adaptive_icon_background: "#0B162C"
  adaptive_icon_foreground: "assets/ikon_depan.png"
