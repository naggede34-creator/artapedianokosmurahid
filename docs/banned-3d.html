<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akun Dibanned — Arta Pedia ID</title>
<style>
  /* Tema: ubah 3 warna ini saja untuk ganti suasana (merah = bawaan). */
  :root{ --a:#ff3b4e; --b:#ff8a3d; --glow:255,59,78; --teks:#ffffff; --redup:#c9b8bc; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--teks);overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;padding:14px}

  .adegan{perspective:1100px;width:100%;max-width:560px}
  .kartu{
    position:relative;transform-style:preserve-3d;border-radius:28px;padding:34px 26px 26px;text-align:center;
    background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 45%,rgba(0,0,0,.28));
    border:1.5px solid rgba(255,255,255,.22);
    box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 1px rgba(var(--glow),.25),0 0 70px rgba(var(--glow),.28),inset 0 1px 0 rgba(255,255,255,.35);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    animation:miring 7s ease-in-out infinite;
  }
  /* sisi tebal kartu (efek 3D): lapisan bayangan bertingkat */
  .kartu::before{content:"";position:absolute;inset:0;border-radius:inherit;transform:translateZ(-26px);
    background:linear-gradient(145deg,rgba(var(--glow),.55),rgba(0,0,0,.6));filter:blur(.5px);z-index:-1}
  .kartu::after{content:"";position:absolute;inset:-2px;border-radius:30px;padding:2px;pointer-events:none;
    background:conic-gradient(from var(--sudut,0deg),transparent 0 70%,var(--a) 85%,var(--b) 95%,transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    animation:putar 4.5s linear infinite}
  @property --sudut{syntax:"<angle>";initial-value:0deg;inherits:false}
  @keyframes putar{to{--sudut:360deg}}
  @keyframes miring{0%,100%{transform:rotateX(7deg) rotateY(-9deg)}50%{transform:rotateX(-5deg) rotateY(9deg)}}

  /* perisai 3D */
  .perisai{width:112px;height:128px;margin:0 auto 6px;transform:translateZ(70px);animation:melayang 3.6s ease-in-out infinite;
    filter:drop-shadow(0 18px 22px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(var(--glow),.65))}
  @keyframes melayang{0%,100%{transform:translateZ(70px) translateY(0)}50%{transform:translateZ(90px) translateY(-9px)}}
  .perisai svg{width:100%;height:100%;display:block}

  .lencana{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:6px 14px;border-radius:999px;transform:translateZ(46px);
    font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff;
    background:rgba(var(--glow),.22);border:1px solid rgba(var(--glow),.6)}
  .titik{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 0 0 rgba(var(--glow),.8);animation:denyut 1.6s infinite}
  @keyframes denyut{70%{box-shadow:0 0 0 10px rgba(var(--glow),0)}100%{box-shadow:0 0 0 0 rgba(var(--glow),0)}}

  h1{margin-top:16px;transform:translateZ(56px);font-size:clamp(24px,7.4vw,38px);line-height:1.08;font-weight:900;letter-spacing:.01em;text-transform:uppercase;
    background:linear-gradient(180deg,#fff 10%,var(--b) 120%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(var(--glow),.9)) drop-shadow(0 6px 0 rgba(0,0,0,.45)) drop-shadow(0 14px 18px rgba(var(--glow),.45))}
  .sebab{margin-top:12px;transform:translateZ(34px);font-size:clamp(13px,3.7vw,16px);line-height:1.5;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fff}
  .sebab b{color:var(--b)}
  .garis{height:2px;margin:20px auto 14px;width:62%;border-radius:2px;transform:translateZ(20px);
    background:linear-gradient(90deg,transparent,var(--a),var(--b),transparent);background-size:200% 100%;animation:kilat 3s linear infinite}
  @keyframes kilat{to{background-position:-200% 0}}
  .kaki{transform:translateZ(18px);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--redup)}

  /* partikel melayang */
  .p{position:absolute;width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--a),var(--b));opacity:.0;animation:naik 7s linear infinite;box-shadow:0 0 14px rgba(var(--glow),.8)}
  .p:nth-child(1){left:8%;bottom:6%;animation-delay:0s}
  .p:nth-child(2){left:22%;bottom:2%;width:7px;height:7px;animation-delay:1.4s}
  .p:nth-child(3){left:46%;bottom:0;animation-delay:2.6s}
  .p:nth-child(4){left:70%;bottom:4%;width:8px;height:8px;animation-delay:.8s}
  .p:nth-child(5){left:88%;bottom:8%;animation-delay:3.4s}
  .p:nth-child(6){left:58%;bottom:2%;width:6px;height:6px;animation-delay:4.6s}
  @keyframes naik{0%{transform:translate3d(0,0,20px) rotate(0);opacity:0}15%{opacity:.9}100%{transform:translate3d(18px,-380px,60px) rotate(240deg);opacity:0}}

  @media (prefers-reduced-motion:reduce){.kartu,.perisai,.garis,.titik,.p,.kartu::after{animation:none!important}}
</style>
</head>
<body>
  <div class="adegan">
    <div class="kartu" role="alert">
      <span class="p"></span><span class="p"></span><span class="p"></span><span class="p"></span><span class="p"></span><span class="p"></span>

      <div class="perisai" aria-hidden="true">
        <svg viewBox="0 0 112 128" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b78"/><stop offset=".55" stop-color="#ff3b4e"/><stop offset="1" stop-color="#8e1224"/></linearGradient>
            <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
          </defs>
          <path d="M56 4 104 22v38c0 33-20 56-48 66C28 116 8 93 8 60V22z" fill="url(#g1)" stroke="#ffd0d5" stroke-width="3" stroke-linejoin="round"/>
          <path d="M56 12 96 27v33c0 28-16 48-40 57C32 108 16 88 16 60V27z" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
          <path d="M56 4 104 22v20C86 36 70 34 56 40 42 34 26 36 8 42V22z" fill="url(#g2)"/>
          <path d="M56 34v40" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
          <circle cx="56" cy="92" r="7.5" fill="#fff"/>
        </svg>
      </div>

      <span class="lencana"><span class="titik"></span>Status: Diblokir</span>

      <h1>Akun Anda Telah Di Banned</h1>
      <p class="sebab"><b>Admin</b> karena telah melanggar ketentuan <b>Arta Pedia ID</b></p>

      <div class="garis"></div>
      <p class="kaki">Arta Pedia ID · Keamanan Akun</p>
    </div>
  </div>
</body>
</html>
